        </div>
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={bandData} margin={{top:20}}>
            <CartesianGrid vertical={false} stroke="rgba(128,128,128,.25)"/>
            <XAxis dataKey="name" tickLine={false}/>
            <YAxis tickLine={false} axisLine={false}/>
            <Tooltip {...tip} formatter={v=>[v+' ('+pct(v,DATA.n)+')','Số lead']}/>
            <Bar dataKey="n">
              {bandData.map(d=><Cell key={d.name} fill={d.fill}/>)}
              <LabelList dataKey="n" position="top" formatter={v=>v+' · '+pct(v,DATA.n)} style={{fill:'var(--ink)',fontSize:12,fontWeight:700}}/>
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>

      <Card tag="PHẦN 3+" title="Doanh thu TB / lead theo Lead Score" note="Area chart: giá trị đơn trung bình (total_revenue) theo từng khoảng điểm – điểm cao có thực sự mua nhiều hơn?">
        <ResponsiveContainer width="100%" height={260}>
          <AreaChart data={DATA.area} margin={{top:10,right:10}}>
            <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={GREEN} stopOpacity={.5}/><stop offset="100%" stopColor={GREEN} stopOpacity={.03}/></linearGradient></defs>
            <CartesianGrid vertical={false} stroke="rgba(128,128,128,.25)"/>
            <XAxis dataKey="bin" tickLine={false} tick={{fontSize:11}}/>
            <YAxis tickFormatter={v=>(v/1e6).toFixed(1)+' tr'} tickLine={false} axisLine={false}/>
            <Tooltip {...tip} formatter={(v,n,p)=>[vnd(v)+' ('+p.payload.n+' leads)','Doanh thu TB']} labelFormatter={l=>'Lead Score '+l}/>
            <Area type="monotone" dataKey="avg" stroke={GREEN} strokeWidth={3} fill="url(#gA)" dot={{r:3,fill:GREEN}}/>
          </AreaChart>
        </ResponsiveContainer>
      </Card>
      <Card tag="PHẦN 4+" title="Hành vi mua sắm theo phân khúc (Radar)" note="% lead của mỗi phân khúc theo kênh mua sắm chính – mỗi phân khúc tổng 100%">
        <ResponsiveContainer width="100%" height={260}>
          <RadarChart data={DATA.radar} outerRadius="72%">
            <PolarGrid stroke="rgba(128,128,128,.4)"/>
            <PolarAngleAxis dataKey="ch" tick={{fontSize:12,fill:'var(--ink)'}}/>
            <PolarRadiusAxis tick={{fontSize:10}} tickFormatter={v=>v+'%'} angle={90}/>
            {DATA.seg.map(s=><Radar key={s.name} name={s.name} dataKey={s.name} stroke={SEGC[s.name]} fill={SEGC[s.name]} fillOpacity={.18} strokeWidth={2}/>)}
            <Tooltip {...tip} formatter={v=>v+'%'}/>
            <Legend/>
          </RadarChart>
        </ResponsiveContainer>
      </Card>

      <Card tag="PHẦN 4" title="Kênh thu hút traffic (utm_source)" note="Số lead theo nguồn traffic"><HBar data={DATA.utm} color={SKY}/></Card>
      <Card tag="PHẦN 4" title="Kênh mua sắm chốt đơn chính (shopping_channel)" note="Số lead theo kênh mua sắm chính"><HBar data={DATA.ch} color={GREEN}/></Card>
    </div>
    <RawTable/>
    <footer className="text-xs mt-6 text-center" style={{color:'var(--mut)'}}>Nguồn: Book1.xls · {DATA.n} dòng · dataset mô phỏng dự án BOO</footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
