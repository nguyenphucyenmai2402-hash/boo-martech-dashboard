<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empire Team – Bài test nhanh</title>
<style>
:root{--bg:#121212;--panel:#1E1E1E;--card:#F5F5F5;--ink:#1a1a1a;--gold:#FFB800;--orange:#FF6B00;--red:#E53935;--green:#2e9e5b;--muted:#9a9a9a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding-bottom:60px}
header{position:sticky;top:0;z-index:20;background:rgba(18,18,18,.96);backdrop-filter:blur(8px);border-bottom:3px solid var(--orange);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bar{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;color:var(--gold);font-size:clamp(15px,4vw,22px)}
.logo svg{width:38px;height:34px}.logo span b{color:var(--orange)}
#timer{display:none;font:800 clamp(18px,5vw,26px) ui-monospace,Menlo,monospace;color:#fff;background:linear-gradient(135deg,var(--orange),var(--red));padding:4px 14px;border-radius:10px;box-shadow:0 0 14px rgba(255,107,0,.5)}
#timer.warn{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 22px var(--red)}}
.prog{max-width:900px;margin:8px auto 0;height:6px;background:#333;border-radius:6px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange));transition:width .3s}
main{max-width:900px;margin:auto;padding:16px 14px}
.hero{text-align:center;padding:40px 16px;background:var(--panel);border:2px solid var(--gold);border-radius:18px;margin-top:20px}
.hero h1{color:var(--gold);font-size:clamp(24px,6vw,36px);margin:10px 0}
.hero p{color:#ccc;margin:6px 0}
.hero ul{list-style:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.hero li{background:#2a2a2a;border:1px solid var(--orange);border-radius:20px;padding:5px 14px;font-size:14px}
.btn{border:0;cursor:pointer;font:800 16px inherit;font-family:inherit;color:#fff;padding:13px 30px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--gold));color:#1a1a1a;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,107,0,.45)}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{box-shadow:0 6px 18px rgba(229,57,53,.5)}
#quiz{display:none}
.group{margin:26px 0 10px}
.group h2{color:var(--gold);font-size:clamp(18px,4.5vw,24px);border-left:6px solid var(--orange);padding-left:12px;margin-bottom:10px}
.info{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;font-size:15px;color:#ddd}
.info ul{margin:6px 0 0 20px}.info li{margin:3px 0}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;display:block;overflow-x:auto;white-space:nowrap}
th,td{padding:7px 12px;border-bottom:1px solid #444;text-align:right}
th{background:var(--orange);color:#fff}th:first-child,td:first-child{text-align:left}
.q{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;margin-top:14px;border-top:5px solid var(--orange)}
.q h3{font-size:16px;margin-bottom:10px}.q h3 span{color:var(--orange)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-top:8px;border:2px solid #d4d4d4;border-radius:10px;background:#fff;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--orange);background:#fff4e6}
.opt input{display:none}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:#e6e6e6;display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--gold);background:#fff3cc;box-shadow:0 0 0 2px var(--gold)}
.opt.sel b{background:var(--orange);color:#fff}
.locked .opt{cursor:default;pointer-events:none}
.opt.ok{border-color:var(--green);background:#e3f6ea;box-shadow:none}.opt.ok b{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:#fde8e7;box-shadow:none}.opt.bad b{background:var(--red);color:#fff}
.exp{display:none;margin-top:12px;padding:10px 12px;background:#fff8e1;border-left:5px solid var(--gold);border-radius:6px;font-size:14px}
.locked .exp{display:block}
.submit{text-align:center;margin:28px 0}
#result{display:none;text-align:center;background:var(--panel);border:3px solid var(--red);border-radius:18px;padding:24px 16px;margin-top:16px}
#result .score{font-size:clamp(44px,14vw,72px);font-weight:900;color:var(--gold)}
#result .score small{font-size:.4em;color:var(--muted)}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.stats div{min-width:92px;padding:10px 14px;border-radius:12px;background:#2a2a2a;border-bottom:4px solid var(--orange)}
.stats .g{border-color:var(--green)}.stats .r{border-color:var(--red)}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:50;padding:16px}
#modal div{background:var(--panel);border:2px solid var(--red);border-radius:16px;padding:22px;max-width:360px;text-align:center}
#modal p{margin-bottom:16px}#modal .btn{margin:4px;padding:10px 20px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">
      <svg viewBox="0 0 64 56" aria-hidden="true"><path d="M6 46 2 14l16 14L32 6l14 22 16-14-4 32z" fill="#FFB800" stroke="#FF6B00" stroke-width="2" stroke-linejoin="round"/><rect x="6" y="48" width="52" height="6" rx="2" fill="#FF6B00"/><circle cx="32" cy="6" r="4" fill="#E53935"/><circle cx="2" cy="14" r="3" fill="#E53935"/><circle cx="62" cy="14" r="3" fill="#E53935"/></svg>
      <span>EMPIRE <b>TEAM</b></span>
    </div>
    <div id="timer">15:00</div>
  </div>
  <div class="prog" id="prog"><i></i></div>
</header>

<main>
  <section class="hero" id="intro">
    <h1>BÀI TEST NHANH</h1>
    <p>Logic &amp; Phân tích số liệu</p>
    <ul><li>10 câu hỏi</li><li>15 phút</li><li>Mỗi câu 1 điểm</li></ul>
    <p>Hết giờ hệ thống sẽ tự động nộp bài. Chúc bạn làm bài tốt!</p>
    <br><button class="btn" id="start">BẮT ĐẦU LÀM BÀI</button>
  </section>

  <section id="quiz">
    <div id="result"></div>
    <div id="list"></div>
    <div class="submit"><button class="btn red" id="submit">NỘP BÀI</button></div>
  </section>
</main>

<div id="modal"><div><p id="mtxt"></p><button class="btn red" id="yes">Nộp bài</button><button class="btn" id="no">Làm tiếp</button></div></div>

<script>
/* a = index đáp án đúng (0=A, 1=B, 2=C, 3=D). Sửa tại đây nếu cần đổi đáp án. */
const DATA=[
{t:"Bài 1: Logic – Trao giải Olympic",info:`<p>Trong một cuộc thi Olympic, năm giải thưởng cao nhất được trao cho các học sinh M, N, P, Q, R. Thông tin buổi trao giải:</p><ul><li>N hoặc Q đạt giải tư.</li><li>R đạt giải cao hơn M.</li><li>P không đạt giải ba.</li></ul>`,qs:[
{q:"Danh sách nào dưới đây có thể là thứ tự các học sinh đạt giải, từ giải nhất đến giải năm?",o:["M, P, N, Q, R","P, R, N, M, Q","N, P, R, Q, M","Q, M, R, N, P"],a:2,e:"A: R giải năm, thấp hơn M → loại. B: giải tư là M (không phải N/Q) → loại. C: Q giải tư, R (3) cao hơn M (5), P giải nhì → thỏa. D: R (3) thấp hơn M (2) → loại."},
{q:"Nếu Q đạt giải năm thì M sẽ đạt giải nào?",o:["Giải nhất","Giải nhì","Giải ba","Giải tư"],a:2,e:"Q giải năm → N giải tư. P, R, M chiếm giải 1–3; P không giải ba, R phải cao hơn M nên R không thể giải ba → M giải ba."},
{q:"Nếu M đạt giải nhì thì phát biểu nào sau đây có thể sai?",o:["N không đạt giải ba","P không đạt giải nhất","P không đạt giải tư","Q không đạt giải nhất"],a:0,e:"M nhì → R nhất. P, N, Q chiếm giải 3–5; P không giải ba và giải tư phải của N/Q → P giải năm; N, Q chia giải ba/tư theo thứ tự bất kỳ. Vậy “N không đạt giải ba” có thể sai (khi N giải ba); các phát biểu còn lại luôn đúng."},
{q:"Nếu P đạt giải cao hơn N đúng 2 bậc thì phát biểu nào nêu đầy đủ và chính xác danh sách học sinh có thể đạt giải nhì?",o:["P","M, R","P, R","M, P, R"],a:2,e:"Cặp (P,N) có thể là (1,3) hoặc (2,4); cặp (3,5) bị loại vì P không giải ba. (1,3): Q giải tư, R nhì, M năm → nhì là R. (2,4): P nhì. Vậy giải nhì chỉ có thể là P hoặc R."}]},
{t:"Bài 2: Logic – Chia xe đi thực địa",info:`<p>Đoàn khảo sát gồm 3 giáo viên R, S, T; 3 học sinh nữ J, K, L và 2 học sinh nam N, O; mỗi người đi một trong 3 xe ô tô, thỏa mãn:</p><ul><li>Mỗi xe chở tối đa 3 người.</li><li>Mỗi xe phải có 1 giáo viên.</li><li>O và S phải ngồi cùng một xe.</li><li>K và L không ngồi cùng một xe.</li><li>N và R không ngồi cùng một xe.</li></ul>`,qs:[
{q:"Điều nào sau đây không thể đúng trong cách sắp xếp người ngồi trên các xe?",o:["K và S có thể ngồi cùng một xe","L và R có thể ngồi cùng một xe","N và S có thể ngồi cùng một xe","O và T có thể ngồi cùng một xe"],a:3,e:"3 giáo viên đi 3 xe, mỗi xe đúng 1 giáo viên. O luôn cùng xe với S nên không thể cùng xe với T."},
{q:"Nếu O ngồi cùng xe với K thì những người nào phải ngồi cùng xe với nhau?",o:["O và N","J và T","N và K","N và T"],a:3,e:"O cùng S nên xe đó gồm S, O, K (đủ 3 người). N không được ngồi cùng R nên N phải ngồi cùng T."},
{q:"Nếu L và R ngồi cùng xe thì người nào có thể ngồi cùng xe với L và R?",o:["J","K","T","O"],a:0,e:"K không cùng L; T là giáo viên xe khác; O phải đi cùng S. Chỉ có J có thể ngồi cùng L và R."},
{q:"Nếu N ngồi cùng xe với S thì câu nào sau đây phải đúng?",o:["J ngồi trên xe có 3 người","L ngồi trên xe có 2 người","K ngồi cùng xe với O","J ngồi cùng xe với N"],a:0,e:"N, O cùng S → xe của S đủ 3 người (S, O, N), nên C và D sai. 5 người còn lại (R, T, J, K, L) chia thành xe 3 và xe 2; K, L khác xe nên J luôn đi cùng K hoặc L → J luôn ở xe có 3 người."}]},
{t:"Bài 3: Phân tích số liệu – Tỉ lệ nam/nữ 2021",info:`<p>Bảng số liệu 5 tỉnh có tỉ lệ nam/nữ cao nhất:</p><table><tr><th>Tỉnh</th><th>Tổng</th><th>Nam</th><th>Nữ</th><th>Tỉ lệ</th></tr><tr><td>Đắk Nông</td><td>622.168</td><td>320.713</td><td>301.455</td><td>1,064</td></tr><tr><td>Lạng Sơn</td><td>781.655</td><td>399.410</td><td>382.245</td><td>1,045</td></tr><tr><td>Bắc Kạn</td><td>313.905</td><td>160.036</td><td>153.869</td><td>1,040</td></tr><tr><td>Quảng Ninh</td><td>1.320.324</td><td>671.522</td><td>648.802</td><td>1,035</td></tr><tr><td>Lào Cai</td><td>730.420</td><td>371.306</td><td>359.114</td><td>1,034</td></tr></table>`,qs:[
{q:"Tỉ lệ nam/nữ trung bình của cả 5 tỉnh là?",o:["1,022","1,042","1,055","1,061"],a:1,e:"Tổng nam = 1.922.987; tổng nữ = 1.845.485 → 1.922.987 ÷ 1.845.485 ≈ 1,042."},
{q:"Biết tỉnh Kiên Giang đứng thứ 6 với tỉ lệ nam/nữ là 1,028 và có 873.236 nam. Dân số Kiên Giang xấp xỉ bao nhiêu?",o:["1.723.000","1.842.000","1.932.000","2.012.000"],a:0,e:"Số nữ ≈ 873.236 ÷ 1,028 ≈ 849.451. Tổng dân số ≈ 873.236 + 849.451 ≈ 1.722.687 ≈ 1.723.000."}]}
];
const $=s=>document.querySelector(s),L='ABCD',TOTAL=10,SEC=900;
let ans={},left=SEC,tick=null,done=false,n=0;

// render
let html='';
DATA.forEach(g=>{
  html+=`<div class="group"><h2>${g.t}</h2><div class="info">${g.info}</div></div>`;
  g.qs.forEach(q=>{
    const i=n++;q.i=i;
    html+=`<div class="q" id="q${i}"><h3><span>Câu ${i+1}.</span> ${q.q}</h3>`+
      q.o.map((o,j)=>`<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="q${i}"><b>${L[j]}</b><span>${o}</span></label>`).join('')+
      `<div class="exp"><strong>Giải thích:</strong> Đáp án đúng <b>${L[q.a]}</b>. ${q.e}</div></div>`;
  });
});
$('#list').innerHTML=html;

document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(!o||done)return;
  const q=+o.dataset.q;
  ans[q]=+o.dataset.o;
  document.querySelectorAll(`#q${q} .opt`).forEach(x=>x.classList.toggle('sel',x===o));
  const c=Object.keys(ans).length;
  $('#prog i').style.width=c/TOTAL*100+'%';
});

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

$('#start').onclick=()=>{
  $('#intro').style.display='none';
  $('#quiz').style.display='block';
  $('#timer').style.display='block';
  $('#prog').style.display='block';
  window.scrollTo(0,0);
  tick=setInterval(()=>{
    left--;$('#timer').textContent=fmt(left);
    if(left<=60)$('#timer').classList.add('warn');
    if(left<=0)finish(true);
  },1000);
};

$('#submit').onclick=()=>{
  const un=TOTAL-Object.keys(ans).length;
  $('#mtxt').textContent=un?`Bạn còn ${un} câu chưa trả lời. Vẫn nộp bài?`:'Bạn chắc chắn muốn nộp bài?';
  $('#modal').style.display='grid';
};
$('#no').onclick=()=>$('#modal').style.display='none';
$('#yes').onclick=()=>finish(false);

function finish(auto){
  if(done)return;done=true;clearInterval(tick);
  $('#modal').style.display='none';
  $('#timer').classList.remove('warn');
  let ok=0,bad=0,blank=0;
  DATA.forEach(g=>g.qs.forEach(q=>{
    const box=$('#q'+q.i);box.classList.add('locked');
    const opts=box.querySelectorAll('.opt');
    opts[q.a].classList.add('ok');
    if(ans[q.i]===undefined)blank++;
    else if(ans[q.i]===q.a)ok++;
    else{bad++;opts[ans[q.i]].classList.remove('sel');opts[ans[q.i]].classList.add('bad');}
  }));
  const used=SEC-Math.max(left,0);
  const msg=ok>=8?'Xuất sắc! Đúng chất Empire!':ok>=5?'Khá tốt, tiếp tục cố gắng!':'Cần luyện tập thêm nhé!';
  const r=$('#result');
  r.style.display='block';
  r.innerHTML=`<h2 style="color:var(--red)">${auto?'HẾT GIỜ – ĐÃ TỰ ĐỘNG NỘP BÀI':'KẾT QUẢ BÀI LÀM'}</h2>
  <div class="score">${ok}<small> / ${TOTAL} điểm</small></div><p>${msg}</p>
  <div class="stats"><div class="g"><b>${ok}</b><span>Câu đúng</span></div><div class="r"><b>${bad}</b><span>Câu sai</span></div><div><b>${blank}</b><span>Chưa làm</span></div><div><b>${fmt(used)}</b><span>Thời gian</span></div></div>
  <p style="color:var(--muted);font-size:14px">Cuộn xuống để xem giải thích chi tiết từng câu.</p><br>
  <button class="btn" onclick="location.reload()">LÀM LẠI</button>`;
  $('.submit').style.display='none';
  $('#prog i').style.width='100%';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
